
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WonderlandJapan Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Noto+Serif+JP:wght@200;400;700;900&family=Inter:wght@100;300;400;600;900&family=Dancing+Script:wght@700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', 'Space Grotesk', sans-serif;
        background-color: #F9F7F2;
        color: #0A0A0A;
        margin: 0;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        letter-spacing: -0.02em;
      }
      #root { min-height: 100vh; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .loader { border: 1px solid #0A0A0A; border-top-color: transparent; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      
      .glass {
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(50px);
        -webkit-backdrop-filter: blur(50px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .font-serif-luxury { font-family: 'Cormorant Garamond', serif; font-weight: 300; }
      .font-washi { font-family: 'Noto Serif JP', serif; font-weight: 200; }
      .font-signature { font-family: 'Dancing Script', cursive; }
      .font-tech { font-family: 'Space Grotesk', sans-serif; font-weight: 300; }

      /* High-end Japanese Design Accents */
      .border-sumi { border-color: #0A0A0A; }
      .bg-sumi { background-color: #0A0A0A; }
      .text-sumi { color: #0A0A0A; }
      
      .shadow-luxury {
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.15), 0 18px 36px -18px rgba(0, 0, 0, 0.2);
      }

      /* Transitions */
      .transition-luxury {
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.05); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.1); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body>
    <div id="root">
      <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh;">
        <div class="loader"></div>
        <p style="margin-top:20px; color:#AF2020; font-weight:900; letter-spacing:0.2em; font-family: sans-serif;">WONDERLAND SYSTEM LOADING...</p>
      </div>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
